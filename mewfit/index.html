<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MewFit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="MewFit เทรนเนอร์ส่วนตัวที่บ้าน: ตารางฝึกที่ปรับระดับเอง ท่าเคลื่อนไหวสาธิต แผนอาหารไทยตามแคลอรี่ ตารางชีวิต และความรู้จากงานวิจัย">
<meta name="theme-color" content="#2443E6">
<link rel="manifest" href="manifest.json" data-pages>
<link rel="icon" href="icon.svg" type="image/svg+xml" data-pages>
<link rel="apple-touch-icon" href="apple-touch-icon.png" data-pages>
<meta name="apple-mobile-web-app-capable" content="yes" data-pages>
<meta name="apple-mobile-web-app-title" content="MewFit" data-pages>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:ital,wght@0,500;0,600;0,700;1,700;1,800&display=swap">
<style>
/* Layout: one-column app shell (max 1000px). A dark-blue "brand surface" hero carries the day's session;
   white cards hold tools; animated stick athlete demonstrates every move. Mono numerals read like a training log. */
:root{
  --bg:#EEF0EB; --surface:#FFFFFF; --sunk:#E4E7E0; --ink:#11161A; --muted:#58615E; --line:#D5D9D2;
  --accent:#2443E6; --accent-ink:#FFFFFF; --accent-soft:#E0E6FF; --hot:#E3336D; --hot-soft:#FFE3EC;
  --good:#13804D; --warn:#A36000; --bad:#C2303A;
  --hero:#0F1A5E; --hero-fg:#FFFFFF; --hero-muted:#C2C9F3; --hero-line:#2C3A8C;
  --fig:#11161A; --prop:#B4BAB4; --figbg:#F4F5F1;
  --shadow:0 1px 0 rgba(17,22,26,.04),0 14px 30px -20px rgba(17,22,26,.45);
  --fd:'Kanit','Leelawadee UI','Noto Sans Thai',system-ui,sans-serif;
  --fb:'IBM Plex Sans Thai','Leelawadee UI','Noto Sans Thai',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F12; --surface:#161A1E; --sunk:#0F1316; --ink:#E9EDE9; --muted:#9AA39E; --line:#262E33;
  --accent:#7D93FF; --accent-ink:#0A0F2A; --accent-soft:#1C2553; --hot:#FF6B97; --hot-soft:#3A1824;
  --good:#4FCB8E; --warn:#EAAA4A; --bad:#F2737C;
  --hero:#17216B; --hero-fg:#FFFFFF; --hero-muted:#BFC7F5; --hero-line:#33429A;
  --fig:#E9EDE9; --prop:#465056; --figbg:#11161A;
  --shadow:0 14px 30px -20px rgba(0,0,0,.85); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C0F12; --surface:#161A1E; --sunk:#0F1316; --ink:#E9EDE9; --muted:#9AA39E; --line:#262E33;
  --accent:#7D93FF; --accent-ink:#0A0F2A; --accent-soft:#1C2553; --hot:#FF6B97; --hot-soft:#3A1824;
  --good:#4FCB8E; --warn:#EAAA4A; --bad:#F2737C;
  --hero:#17216B; --hero-fg:#FFFFFF; --hero-muted:#BFC7F5; --hero-line:#33429A;
  --fig:#E9EDE9; --prop:#465056; --figbg:#11161A;
  --shadow:0 14px 30px -20px rgba(0,0,0,.85); color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--fb)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--fd);font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,4.4vw,2.2rem)} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea,output{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar + logo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:58px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
.logo{width:34px;height:34px;flex:none;display:block}
.logo .lb{fill:var(--accent)} .logo .lm{stroke:var(--accent-ink)} .logo .ln{fill:var(--hot)}
.wm{font-family:var(--fd);font-style:italic;font-weight:800;font-size:1.42rem;letter-spacing:-.02em;line-height:1}
.wm em{font-style:italic;color:var(--accent)}
.tabs{display:none;gap:2px;margin-left:auto}
.tabs a,.top-mini a{text-decoration:none;color:var(--muted);padding:7px 11px;border-radius:999px;font-weight:500;font-size:.92rem}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"],.top-mini a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.top-mini{margin-left:auto;display:flex;gap:2px}
@media (min-width:880px){.tabs{display:flex}.top-mini{display:none}}
body.v-start .tabs,body.v-start .top-mini,body.v-start .bottom{display:none!important}

main{max-width:1000px;margin:0 auto;padding-block:20px calc(110px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:880px){main{padding-block:28px 72px}}
.view{display:flex;flex-direction:column;gap:16px}
.view-head{display:flex;flex-direction:column;gap:6px;margin-bottom:2px}
.view-head p{max-width:62ch}

/* bottom nav with raised train button */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:500}
.bottom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bottom a[aria-current="page"]{color:var(--accent)}
.bottom a.mid .ic{width:52px;height:52px;margin-top:-22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 18px -8px var(--accent);border:4px solid var(--surface)}
.bottom a.mid svg{width:24px;height:24px}
.bottom a.mid[aria-current="page"]{color:var(--ink)}
@media (min-width:880px){.bottom{display:none}}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.grid{display:grid;gap:16px}
@media (min-width:740px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;line-height:1.2;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);transition:transform .12s,filter .12s}
.btn:hover{border-color:var(--muted)} .btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.hot{background:var(--hot);border-color:var(--hot);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn.big{padding:14px 22px;font-size:1.05rem}
.btn.wide{width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--ink)} .chip.hot{background:var(--hot-soft);color:var(--hot)}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button.chip{border:1px solid transparent;cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.banner{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:16px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.note{border-radius:14px;padding:12px 14px;background:var(--hot-soft);color:var(--ink);font-size:.9rem}
.note.ok{background:var(--accent-soft)}

/* hero brand surface */
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-fg);border-radius:24px;padding:22px;display:grid;gap:12px;
  grid-template-columns:1fr;box-shadow:var(--shadow);
  background-image:repeating-linear-gradient(-58deg,transparent 0 22px,rgba(255,255,255,.035) 22px 44px)}
@media (min-width:640px){.hero{grid-template-columns:1.25fr 1fr;padding:28px;align-items:center}}
.hero .eyebrow{color:var(--hero-muted)}
.hero p{color:var(--hero-muted);max-width:52ch}
.hero-txt{display:flex;flex-direction:column;gap:10px;min-width:0}
.hero h1{font-style:italic;font-weight:800}
.hero .btn{border-color:var(--hero-line);background:transparent;color:var(--hero-fg)}
.hero .btn.pri{background:var(--hero-fg);border-color:var(--hero-fg);color:var(--hero)}
.hero .btn.hot{background:var(--hot);border-color:var(--hot);color:#fff}
.hero-sess{display:flex;flex-direction:column;border-left:3px solid var(--hot);padding-left:12px}
.hero-sess b{font-family:var(--fd);font-size:1.2rem}
.hero-sess span{color:var(--hero-muted);font-size:.9rem}
.hero-fig{background:rgba(255,255,255,.06);border-radius:18px;padding:6px;--fig:var(--hero-fg);--prop:var(--hero-line)}
.hero-fig .gr{stroke:var(--hero-line)}
@media (max-width:639px){.hero-fig{max-width:250px;width:100%;justify-self:center}}

/* animated figure */
.fig{width:100%;height:auto;display:block}
.fig .l{fill:none;stroke:var(--fig);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.fig .far{opacity:.32} .fig.front .far{opacity:1}
.fig .hd{fill:var(--fig)} .fig .db{fill:var(--hot)}
.fig .gr{stroke:var(--prop);stroke-width:2}
.fig .pf{fill:var(--prop)} .fig .ps{stroke:var(--prop);stroke-linecap:round}
.fig .tw{stroke:var(--hot);stroke-width:3;stroke-dasharray:4 3}
.figbox{background:var(--figbg);border-radius:14px;padding:4px;border:1px solid var(--line)}
.mini{width:84px;flex:none}

/* rings */
.ringwrap{display:grid;grid-template-columns:128px 1fr;gap:18px;align-items:center}
.rings{width:128px;height:128px}
.legend{display:flex;flex-direction:column;gap:10px;min-width:0}
.legend div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:baseline}
.legend i{width:10px;height:10px;border-radius:50%;display:block;align-self:center}
.legend b{font-family:var(--fm);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.legend b small{color:var(--muted);font-weight:500}

/* metrics */
.metric{display:flex;flex-direction:column;gap:6px}
.metric .top-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.metric .val{font-family:var(--fm);font-weight:600;font-size:1.05rem}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .3s}
.bar.over i{background:var(--warn)} .bar.ok i{background:var(--good)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.kpi{background:var(--sunk);border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--fm);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border-radius:12px;padding:8px 2px;text-align:center;background:var(--sunk);display:flex;flex-direction:column;gap:2px;min-width:0;border:1.5px solid transparent}
.wd b{font-family:var(--fd);font-size:.95rem}
.wd span{font-size:.66rem;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}
.wd.train{background:var(--accent-soft)}
.wd.today{border-color:var(--accent)}
.wd.done{background:var(--accent);color:var(--accent-ink)} .wd.done span{color:var(--accent-ink)}
button.wd{cursor:pointer;font:inherit;color:inherit}
button.wd[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}

/* tools */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tool{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--shadow)}
.tool:hover{border-color:var(--accent)} .tool:focus-visible{outline:2px solid var(--accent)}
.tool b{font-family:var(--fd);font-size:1rem;line-height:1.25}
.tool span{font-size:.78rem;color:var(--muted)}
.tool .t-ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;margin-bottom:4px}
.tool .t-ic svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:420px){.tools{grid-template-columns:1fr 1fr}.tools .tool:last-child{grid-column:span 2}}

/* counters */
.counter{display:flex;align-items:center;gap:10px}
.counter .btn{width:40px;height:40px;padding:0;font-size:1.2rem}
.glasses{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.glasses i{width:13px;height:19px;border:1.5px solid var(--good);border-radius:2px 2px 5px 5px;display:block}
.glasses i.on{background:var(--good)}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:.88rem;font-weight:500;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0}
textarea{font-family:var(--fm);font-size:.8rem;min-height:90px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{cursor:pointer}
.seg input,.opt input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:.9rem;font-weight:500;background:var(--surface)}
.seg input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span,.opt input:focus-visible+div{outline:2px solid var(--accent);outline-offset:2px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-weight:600;font-size:.92rem;padding:0;margin-bottom:6px}
.opts{display:grid;gap:10px}
@media (min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{cursor:pointer;display:block}
.opt>div{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;background:var(--surface);transition:border-color .15s}
.opt b{font-family:var(--fd);font-size:1.05rem;font-weight:600}
.opt span{font-size:.86rem;color:var(--muted)}
.opt input:checked+div{border-color:var(--accent);background:var(--accent-soft)}
.opt .tag{align-self:flex-start;margin-bottom:2px}

/* onboarding */
.ob{max-width:620px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.ob-prog{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.ob-prog i{height:5px;border-radius:3px;background:var(--line)}
.ob-prog i.on{background:var(--accent)}
.ob-why{display:flex;gap:8px;font-size:.88rem;color:var(--muted);background:var(--sunk);border-radius:12px;padding:10px 12px}
.ob-why b{color:var(--ink);white-space:nowrap}
.ob-nav{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;border-top:1px solid var(--line);z-index:5}
.ob-nav .btn.pri{flex:1}
.ob-hero{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.ob-hero .logo{width:72px;height:72px}
.ob-hero h1{font-size:clamp(1.9rem,6vw,2.6rem);font-style:italic;font-weight:800}
.feat{display:grid;gap:10px}
.feat>div{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.feat>div>div{min-width:0}
.feat .n{font-size:.8rem;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--fd);font-weight:700;color:var(--accent)}
.feat p{color:var(--muted);font-size:.9rem}
.need{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.need li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.need li span:last-child{color:var(--muted);text-align:right}
.yn{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.yn p{font-size:.93rem}
.yn .seg span{padding:6px 14px}
.bignum input{font-family:var(--fm);font-size:1.25rem;font-weight:600;padding:12px 14px}

/* workout player */
.player .pl-stage{position:relative}
.pl-k{position:absolute;top:10px;left:10px}
.pl-name{font-size:clamp(1.4rem,5vw,1.9rem)}
.ladder{display:flex;gap:3px;margin-top:2px}
.ladder i{height:5px;flex:1;max-width:24px;border-radius:3px;background:var(--sunk)}
.ladder i.on{background:var(--accent)}
.pl-target{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pl-target div{background:var(--sunk);border-radius:14px;padding:10px;display:flex;flex-direction:column;min-width:0}
.pl-target b{font-family:var(--fm);font-size:1.1rem;font-weight:600;overflow-wrap:anywhere}
.pl-target span{font-size:.75rem;color:var(--muted)}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center}
.stepper .btn{height:64px;font-size:1.8rem;padding:0}
.stepper output{text-align:center;font-family:var(--fm);font-weight:600;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.setdots{display:flex;gap:8px;flex-wrap:wrap}
.sd{all:unset;cursor:pointer;min-width:40px;height:40px;padding:0 6px;box-sizing:border-box;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--fm);font-weight:600;color:var(--muted)}
.sd.on{border:1.5px solid var(--good);color:var(--good);background:var(--surface)}
.sd.cur{border-color:var(--accent);border-style:solid;color:var(--accent)}
.sd:focus-visible{outline:2px solid var(--accent)}
.pl-rest{background:var(--hero);color:var(--hero-fg);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pl-rest .eyebrow{color:var(--hero-muted)}
.pl-rest b{font-family:var(--fm);font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}
.pl-rest p{color:var(--hero-muted)}
.pl-rest .btn{border-color:var(--hero-line);background:transparent;color:var(--hero-fg)}
.pl-rest .btn.pri{background:var(--hero-fg);color:var(--hero);border-color:var(--hero-fg)}
.pl-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r0 = v => Math.round(v);
const r1 = v => Math.round(v * 10) / 10;
const fmt = v => Math.round(v).toLocaleString('th-TH');
const iso = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dayDiff = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const thDate = s => { const d = parseISO(s); return d.getDate() + ' ' + MONTH_TH[d.getMonth()]; };
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return (h * 60 + (m || 0)) % 1440; };
const toHM = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const DAY_S = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
const DAY_L = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const MONTH_TH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];
const mondayOf = s => { const d = parseISO(s); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return iso(d); };
function rng(seed) { let x = seed >>> 0 || 1; return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return ((x >>> 0) % 1e6) / 1e6; }; }


/* ---------- state ---------- */
const KEY = 'mewfit.v1';
const APP_URL = 'https://mewuserr.github.io/mewfit/';
const DEMO = { name: '', sex: 'm', age: 28, height: 172, weight: 75, waist: null, activity: 'light', goal: 'cut', level: 'beginner',
  days: [1, 3, 5], minutes: 30, eq: { db: false, band: false, bar: false }, wake: '06:30', bed: '22:30',
  workStart: '09:00', workEnd: '18:00', noWork: false, trainTime: 'evening', whey: false, finisher: true, caution: false, par: [], baseline: {} };
const fresh = () => ({ v: 2, profile: null, seenDemo: false, guideDone: false, voice: true, levels: {}, calAdjust: 0, workouts: [], weights: [], body: [], food: {}, habits: {}, session: null, mealSeed: 7 });
let S = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = Object.assign(fresh(), JSON.parse(raw));
      if (o.profile) o.profile = Object.assign({}, DEMO, o.profile);
      if (o.session && !o.session.cur) o.session.cur = { i: 0, s: 0 };
      return o;
    }
  } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const P = () => S.profile || DEMO;
const isDemo = () => !S.profile;

/* ---------- science: energy & macros ---------- */
const ACT = {
  sedentary: { f: 1.2, l: 'นั่งทำงานทั้งวัน แทบไม่ได้เดิน' },
  light: { f: 1.375, l: 'เดินบ้าง ออกกำลัง 1–3 วัน/สัปดาห์' },
  moderate: { f: 1.55, l: 'ออกกำลัง 3–5 วัน หรืองานที่เดินเยอะ' },
  high: { f: 1.725, l: 'ออกกำลังหนัก 6–7 วัน หรืองานใช้แรง' }
};
const GOALS = {
  cut: { l: 'ลดไขมัน', d: 'ลีนลง เห็นกล้ามชัดขึ้น', adj: -0.20, prot: 2.0, rate: [-1.0, -0.5] },
  recomp: { l: 'ลดไขมัน + เพิ่มกล้าม', d: 'Recomp เหมาะกับมือใหม่', adj: -0.10, prot: 2.0, rate: [-0.5, 0] },
  bulk: { l: 'เพิ่มกล้าม', d: 'Lean bulk ตัวใหญ่ขึ้นแบบไขมันไม่พอก', adj: 0.10, prot: 1.8, rate: [0.25, 0.5] },
  maintain: { l: 'รักษาหุ่น', d: 'แข็งแรง สุขภาพดี น้ำหนักคงที่', adj: 0, prot: 1.6, rate: [-0.25, 0.25] }
};
const LEVELS = { beginner: 'มือใหม่ (0–6 เดือน)', intermediate: 'เคยฝึกต่อเนื่อง (6 เดือน–2 ปี)', advanced: 'ฝึกจริงจังมา 2 ปีขึ้นไป' };

function calc(p = P()) {
  const bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === 'm' ? 5 : -161);
  const tdee = bmr * ACT[p.activity].f;
  const g = GOALS[p.goal];
  const floor = p.sex === 'm' ? 1500 : 1200;
  const adj = isDemo() ? 0 : (S.calAdjust || 0);
  const kcal = Math.round(Math.max(tdee * (1 + g.adj) + adj, floor) / 10) * 10;
  const hm = p.height / 100, bmi = p.weight / (hm * hm);
  const refW = bmi > 30 ? 25 * hm * hm : p.weight;
  const protein = r0(g.prot * refW);
  const fat = r0(Math.max(0.8 * refW, kcal * 0.25 / 9));
  const carb = Math.max(0, r0((kcal - protein * 4 - fat * 9) / 4));
  const water = Math.round(p.weight * 35 / 50) * 50;
  return { bmr: r0(bmr), tdee: r0(tdee), kcal, protein, fat, carb, bmi: r1(bmi), refW: r1(refW), water,
    glasses: Math.ceil(water / 250), fiber: Math.max(25, r0(kcal / 1000 * 14)),
    steps: (p.goal === 'cut' || p.goal === 'recomp') ? 9000 : 7500, perMeal: r0(0.4 * refW), adj, floor,
    rateKg: g.rate.map(x => r1(p.weight * x / 100)) };
}

/* ---------- exercise library (progression ladders, easiest → hardest) ---------- */
const X = (id, n, en, r, cues, mis, o = {}) => Object.assign({ id, n, en, r, cues, mis }, o);
const LAD = {
  push: [
    X('p_wall', 'วิดพื้นกับกำแพง', 'Wall push-up', [10, 20], ['ยืนห่างกำแพงประมาณหนึ่งช่วงแขน มือกว้างกว่าไหล่เล็กน้อย', 'ลำตัวตรงเป็นแผ่นเดียว เกร็งท้องและบีบก้น', 'งอศอกให้อกเข้าใกล้กำแพง แล้วดันกลับ'], 'ศอกกางออก 90° จะเจ็บไหล่ ให้ศอกเฉียงราว 45° จากลำตัว'),
    X('p_incline', 'วิดพื้นมือวางบนโต๊ะหรือขอบเตียง', 'Incline push-up', [8, 15], ['วางมือบนของที่มั่นคง ไม่เลื่อน', 'ยิ่งที่วางมือต่ำ ยิ่งยาก', 'ลงจนอกเกือบแตะขอบ'], 'ก้นโด่งหรือสะโพกตก ให้ลำตัวตรงตลอด'),
    X('p_knee', 'วิดพื้นคุกเข่า', 'Knee push-up', [8, 15], ['เข่าวางบนผ้าหรือเบาะ', 'ลำตัวตรงตั้งแต่เข่าถึงศีรษะ', 'ลงช้า 2 วินาที ดันขึ้น 1 วินาที'], 'ก้มแค่คอ อกไม่ลง ให้ลงทั้งตัว'),
    X('p_std', 'วิดพื้นมาตรฐาน', 'Push-up', [6, 15], ['มืออยู่ใต้ไหล่หรือกว้างกว่านิดหน่อย', 'เกร็งท้อง บีบก้น ตัวตรงเหมือนแผ่นไม้', 'ลงจนอกห่างพื้นราวหนึ่งกำปั้น'], 'หลังแอ่น สะโพกตก ให้ลดขั้นแล้วฝึกฟอร์มก่อน'),
    X('p_close', 'วิดพื้นมือชิด', 'Close-grip push-up', [6, 15], ['มือห่างกันประมาณหนึ่งฝ่ามือใต้หน้าอก', 'ศอกแนบลำตัว เน้นหลังแขน'], 'ศอกบานออกข้าง'),
    X('p_decline', 'วิดพื้นยกเท้าสูง', 'Decline push-up', [6, 15], ['วางเท้าบนเก้าอี้หรือโซฟา', 'เน้นอกส่วนบนและไหล่หน้า'], 'คอยื่นนำลงไป ให้อกนำ'),
    X('p_archer', 'วิดพื้นแบบนักธนู', 'Archer push-up', [4, 10], ['มือกว้างมาก ลงไปทางด้านหนึ่ง แขนอีกข้างเหยียดตรง', 'สลับซ้ายขวา นับข้างละหนึ่งครั้ง'], 'บิดสะโพกช่วย')
  ],

function genMealPlan() {

  const plan = {}; Object.keys(MEALS).forEach(m => { const opts = MEALS[m]; plan[m] = opts[Math.floor(R() * opts.length)].map(x => x.slice()); });
  const all = () => sumItems([].concat(...Object.values(plan)));

  let g = 0;

    else { const fr = plan.snack.findIndex(x => FM[x[0]].cat === 'fruit'); if (fr >= 0) plan.snack.splice(fr, 1); else break; }
    g++;
  }
  Object.keys(plan).forEach(m => { plan[m] = plan[m].filter(x => x[1] > 0); });

}

/* ---------- workout actions ---------- */
let wakeLock = null;
async function lockScreen() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {} }
function unlockScreen() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
function startSession(tid) {
  if (S.session && S.session.date === iso()) { location.hash = 'train'; return; }
  S.session = buildSession(tid); ui.stepVal = null; ui.cancelAsk = false; save(); lockScreen();
  if (location.hash !== '#train') location.hash = 'train'; else render();
  window.scrollTo(0, 0);
}
function shiftLevel(i, dir, quiet) {
  const x = S.session.ex[i], L = ladder(x.pt), k = L.findIndex(y => y.id === x.id), n = clamp(k + dir, 0, L.length - 1);
  if (n === k) return false;
  x.id = L[n].id; S.levels[x.pt] = x.id; x.reps = Array(x.sets).fill(''); S.session.cur = { i, s: 0 }; ui.stepVal = null; stopRest(); save(); render();
  if (!quiet) toast(`${dir > 0 ? 'ยากขึ้น' : 'ง่ายลง'}: ${L[n].n}`);
  return true;
}
function stopSW() { if (ui.sw) { clearInterval(ui.sw.iv); ui.sw = null; } }
function logSet() {
  const s = S.session, c = s.cur, x = s.ex[c.i], e = EXM[x.id];
  stopSW(); x.reps[c.s] = Math.max(0, Math.round(ui.stepVal || 0)); ui.stepVal = null; ui.cancelAsk = false;
  const prevI = c.i; advance(s); save(); beep(760, .1);
  if (!sessionDone(s)) {
    const nx = s.ex[s.cur.i], label = s.cur.i === prevI ? `ต่อไป: ${e.n} เซต ${s.cur.s + 1}` : `ต่อไป: ${EXM[nx.id].n}`;
    startRest(e.t ? 45 : (s.cur.i === prevI ? 75 : 90), label);
  } else { stopRest(); toast('ครบทุกเซตแล้ว'); }
  render(); window.scrollTo(0, 0);
}
function finishSession() {
  const s = S.session; if (!s) return;
  const ups = [], downs = []; let reps = 0, sets = 0;
  s.ex.forEach(x => {
    const e = EXM[x.id], L = ladder(x.pt), k = L.findIndex(y => y.id === x.id);
    const v = x.reps.filter(n => n !== '').map(Number); reps += v.reduce((a, b) => a + b, 0); sets += v.length;
    if (!v.length || x.skip) return;
    if (v.length === x.sets && Math.min(...v) >= e.r[1]) {
      if (k < L.length - 1) { S.levels[x.pt] = L[k + 1].id; ups.push(`${e.n} → ${L[k + 1].n}`); }
      else { S.levels[x.pt] = x.id; ups.push(`${e.n}: ขั้นสูงสุดแล้ว ครั้งหน้าลงช้า 3 วินาทีหรือเพิ่มอีกหนึ่งเซต`); }
    } else if (Math.max(...v) < e.r[0] && k > 0) { S.levels[x.pt] = L[k - 1].id; downs.push(`${e.n} → ${L[k - 1].n}`); }
    else S.levels[x.pt] = x.id;
  });
  if (!sets) { toast('ยังไม่ได้บันทึกเซตไหนเลย'); return; }
  const mins = Math.min(180, Math.max(1, Math.round((Date.now() - s.start) / 60000)));
  S.workouts.push({ date: s.date, tid: s.tid, name: TPL[s.tid].n, mins, sets, reps, ups, ex: s.ex.map(x => ({ id: x.id, reps: x.reps })) });
  S.session = null; ui.stepVal = null; save(); unlockScreen(); stopRest(); stopSW();
  showModal(`<span class="chip good" style="align-self:flex-start">บันทึกแล้ว</span><h2>เสร็จแล้ว เก่งมาก</h2><div class="kpis"><div class="kpi"><b>${sets}</b><span>เซต</span></div><div class="kpi"><b>${fmt(reps)}</b><span>ครั้งรวม</span></div><div class="kpi"><b>${mins}</b><span>นาที</span></div></div>
    ${ups.length ? `<div><b>เลื่อนขั้นครั้งหน้า</b><ul>${ups.map(u => `<li>${esc(u)}</li>`).join('')}</ul></div>` : '<p class="muted">ครั้งหน้าพยายามเพิ่มอีก 1–2 ครั้งในแต่ละเซต ทำได้ถึงเพดานทุกเซตเมื่อไหร่ ระบบจะเลื่อนขั้นให้</p>'}
    ${downs.length ? `<div><b>ปรับให้ง่ายลงก่อน</b><ul>${downs.map(u => `<li>${esc(u)}</li>`).join('')}</ul></div>` : ''}

/* ---------- rest timer ---------- */
const rest = { on: false, end: 0, iv: null, label: '' };
function startRest(sec, label) {

/* ---------- audio + voice ---------- */

let thVoice = null;

if ('speechSynthesis' in window) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }
function speak(t) { if (!S.voice || !thVoice) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.voice = thVoice; u.lang = thVoice.lang; u.rate = 1.05; speechSynthesis.speak(u); } catch (e) {} }

function seqProg(title, items, gap) {

  items.forEach(([n, s, f], i) => { pr.push({ n, s, k: 'work', f }); if (i < items.length - 1 && gap) pr.push({ n: 'พัก', s: gap, k: 'rest', next: items[i + 1][0], f: items[i + 1][2] }); });
  pr.title = title; return pr;
}

  stretch: () => seqProg('ยืดเหยียด 8 นาที', [['ท่าแมว-วัว คลายหลัง', 45, null], ['ยืดอกที่ขอบประตู', 45, null], ['ยืดสะโพกด้านหน้า ข้างซ้าย', 45, 'split'], ['ยืดสะโพกด้านหน้า ข้างขวา', 45, 'split'], ['ก้มยืดต้นขาด้านหลัง', 45, 'rdl'], ['ยกสะโพกค้างไว้', 40, 'bridge'], ['นอนบิดลำตัว ข้างละ 20 วินาที', 45, null], ['ท่าเด็ก หายใจลึกๆ', 60, null]], 8),

function hStart(prog) {

  if (ph.k === 'work') speak(ph.n); else if (ph.k === 'rest') speak('พัก ต่อไป ' + ph.next); else speak('เตรียมตัว ' + (H.prog[1] ? H.prog[1].n : ''));

function hDraw() {
  const ph = H.prog[H.i], left = H.paused ? H.left : (H.end - Date.now()) / 1000;

  const nx = H.prog.slice(H.i + 1).find(x => x.k === 'work'); $('#h-next').textContent = ph.k === 'work' && nx ? 'ถัดไป: ' + nx.n : '';
  const doneS = H.prog.slice(0, H.i).reduce((a, b) => a + b.s, 0) + (ph.s - Math.max(0, left));

function hTick() {

  const p = P(), map = weekMap(p), d = ui.planDay, tid = map[d], tl = timeline(p, tid);
  const sleepH = ((toMin(p.wake) - toMin(p.bed) + 1440) % 1440) / 60;
  $('#v-plan').innerHTML = `
  ${demoBanner()}
  <div class="view-head"><span class="eyebrow">ตื่น ${p.wake} · นอน ${p.bed} · งาน ${p.workStart}–${p.workEnd}</span><h1>ตารางชีวิต</h1>
    <p class="muted">จัดวันให้เหมือนมีเทรนเนอร์คอยเตือน เลือกวันเพื่อดูตาราง เปลี่ยนเวลาได้ในหน้าโปรไฟล์</p></div>
  <article class="card">${weekStrip(p, { pick: true })}</article>
  <article class="card">
    <div class="row between"><h2>วัน${DAY_L[d]}</h2><span class="chip ${tid ? 'acc' : ''}">${tid ? esc(TPL[tid].n) : 'วันพัก'}</span></div>
    <ol class="tl">${tl.map(x => `<li class="k-${x.k}"><time>${toHM(x.t)}</time><span class="dot" aria-hidden="true"></span><div><b>${esc(x.title)}</b><p>${esc(x.note)}</p></div></li>`).join('')}</ol>
    <div class="row"><button class="btn sm" data-act="copy-plan">คัดลอกตารางเป็นข้อความ</button></div>
  </article>
  <div class="grid g3">
    <div class="kpi"><b>${r1(sleepH)} ชม.</b><span>ช่วงนอน ${sleepH < 7 ? '(น้อยไป)' : '(ดี)'}</span></div>
    <div class="kpi"><b>${fmt(calc().steps)}</b><span>ก้าวต่อวัน</span></div>
    <div class="kpi"><b>${toHM(toMin(p.bed) - 480)}</b><span>กาแฟแก้วสุดท้าย</span></div>
  </div>`;
}

function chartSVG(ws) {
  if (ws.length < 2) return '<p class="muted">บันทึกน้ำหนักอย่างน้อย 2 ครั้งเพื่อดูกราฟ</p>';
  const W = 560, H = 240, L = 52, R = 14, T = 16, B = 34;
  const first = ws[0].d, span = Math.max(1, dayDiff(first, ws[ws.length - 1].d));
  const avg = ws.map(w => { const xs = ws.filter(o => { const t = dayDiff(o.d, w.d); return t >= 0 && t < 7; }).map(o => o.kg); return xs.reduce((a, b) => a + b, 0) / xs.length; });
  let lo = Math.min(...ws.map(w => w.kg)), hi = Math.max(...ws.map(w => w.kg));
  lo = Math.floor(lo * 2) / 2 - 0.5; hi = Math.ceil(hi * 2) / 2 + 0.5;
  const x = d => L + dayDiff(first, d) / span * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const step = (hi - lo) > 6 ? 2 : (hi - lo) > 3 ? 1 : 0.5;
  let grid = ''; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) grid += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v.toFixed(step < 1 ? 1 : 0)}</text>`;
  const line = ws.map((w, i) => `${i ? 'L' : 'M'}${x(w.d).toFixed(1)},${y(avg[i]).toFixed(1)}`).join('');
  const lx = x(ws[ws.length - 1].d), ly = y(avg[avg.length - 1]);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟน้ำหนัก">
    ${grid}
    ${ws.map(w => `<circle cx="${x(w.d).toFixed(1)}" cy="${y(w.kg).toFixed(1)}" r="3" fill="var(--muted)" opacity=".55"/>`).join('')}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx}" cy="${ly}" r="5.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text class="ax" x="${L}" y="${H - 8}">${thDate(first)}</text><text class="ax" x="${W - R}" y="${H - 8}" text-anchor="end">${thDate(ws[ws.length - 1].d)}</text>
  </svg>`;
}

function rProgress() {
  const p = P(), c = calc(), ws = weightsSorted(), tr = trend(ws), adv = coachAdvice(tr);
  const b = S.body.slice().sort((a, z) => a.d < z.d ? -1 : 1), lastB = b[b.length - 1];
  const bf = navyBF(p, lastB), whtr = lastB && lastB.waist ? lastB.waist / p.height : null;

  ${demoBanner()}
  <div class="view-head"><span class="eyebrow">ชั่งตอนเช้า หลังเข้าห้องน้ำ ก่อนกิน</span><h1>ความคืบหน้า</h1></div>

    <div class="row"><label class="f" style="flex:1 1 140px">วันที่<input type="date" id="w-d" value="${iso()}" max="${iso()}"></label><label class="f" style="flex:1 1 120px">น้ำหนัก (กก.)<input type="number" id="w-kg" inputmode="decimal" step="0.1" min="25" max="300" placeholder="${p.weight}"></label><button class="btn pri" data-act="w-add" style="align-self:flex-end">บันทึก</button></div>
    <div class="chart">${chartSVG(ws)}</div>
    <p class="small muted">จุดสีเทาคือน้ำหนักแต่ละวัน เส้นคือค่าเฉลี่ย 7 วัน น้ำหนักรายวันแกว่งได้ 1–2 กก. จากน้ำและเกลือ ให้ดูเส้นเฉลี่ย</p>
    <div class="kpis">
      <div class="kpi"><b>${tr && tr.a1 ? r1(tr.a1) : '–'}</b><span>เฉลี่ย 7 วันล่าสุด (กก.)</span></div>
      <div class="kpi"><b>${tr && tr.wk != null ? (tr.wk > 0 ? '+' : '') + r1(tr.wk) : '–'}</b><span>เปลี่ยนต่อสัปดาห์ (กก.)</span></div>
      <div class="kpi"><b class="num">${c.rateKg[0]}…${c.rateKg[1]}</b><span>เป้าต่อสัปดาห์ (กก.)</span></div>
    </div>
    <div class="coach">${AV}<div class="stack"><p>${esc(adv.msg)}</p>${adv.delta && !demoW ? `<div class="row"><button class="btn sm pri" data-act="adjust" data-n="${adv.delta}">ปรับเป้าแคลอรี่ ${adv.delta > 0 ? '+' : ''}${adv.delta} kcal</button>${S.calAdjust ? `<span class="small muted">ปรับสะสมแล้ว ${S.calAdjust > 0 ? '+' : ''}${S.calAdjust} kcal</span>` : ''}</div>` : ''}</div></div>
    ${S.weights.length ? `<details><summary>รายการที่บันทึก (${S.weights.length})</summary><ul class="log-list">${S.weights.slice().sort((a, z) => a.d < z.d ? 1 : -1).slice(0, 30).map(w => `<li><span>${thDate(w.d)}</span><span class="mono">${w.kg} กก.</span><button class="btn sm ghost" data-act="w-del" data-d="${w.d}">ลบ</button></li>`).join('')}</ul></details>` : ''}
  </article>
  <article class="card">
    <h2>สัดส่วนร่างกาย</h2>
    <p class="small muted">วัดด้วยสายวัด ตอนเช้า รอบเอววัดระดับสะดือ รอบคอวัดใต้ลูกกระเดือก${p.sex === 'f' ? ' รอบสะโพกวัดจุดที่กว้างที่สุด' : ''}</p>
    <div class="fgrid"><label class="f">รอบเอว (ซม.)<input type="number" id="b-waist" inputmode="decimal" step="0.5" value="${lastB ? lastB.waist || '' : ''}"></label><label class="f">รอบคอ (ซม.)<input type="number" id="b-neck" inputmode="decimal" step="0.5" value="${lastB ? lastB.neck || '' : ''}"></label>${p.sex === 'f' ? `<label class="f">รอบสะโพก (ซม.)<input type="number" id="b-hip" inputmode="decimal" step="0.5" value="${lastB ? lastB.hip || '' : ''}"></label>` : ''}</div>
    <div class="row"><button class="btn" data-act="b-add">บันทึกสัดส่วน</button></div>
    <div class="kpis">
      <div class="kpi"><b>${c.bmi}</b><span>BMI ${c.bmi < 18.5 ? 'ผอม' : c.bmi < 23 ? 'ปกติ (เกณฑ์เอเชีย)' : c.bmi < 25 ? 'ท้วม' : 'เกิน'}</span></div>
      <div class="kpi"><b>${bf ? r1(bf) + '%' : '–'}</b><span>ไขมันโดยประมาณ (สูตร US Navy)</span></div>
      <div class="kpi"><b>${whtr ? whtr.toFixed(2) : '–'}</b><span>เอวต่อส่วนสูง ${whtr ? (whtr < 0.5 ? '(ดี ต่ำกว่า 0.5)' : '(ควรต่ำกว่า 0.5)') : ''}</span></div>
    </div>
    ${b.length > 1 ? `<p class="small">รอบเอว: ${thDate(b[0].d)} <span class="mono">${b[0].waist}</span> → ${thDate(lastB.d)} <span class="mono">${lastB.waist}</span> ซม. (${r1(lastB.waist - b[0].waist) > 0 ? '+' : ''}${r1(lastB.waist - b[0].waist)})</p>` : ''}
  </article>
  <article class="card">
    <h2>บันทึกการฝึก</h2>
    <div class="kpis"><div class="kpi"><b>${total}</b><span>ครั้งทั้งหมด</span></div><div class="kpi"><b>${fmt(reps)}</b><span>จำนวนครั้งรวม</span></div><div class="kpi"><b>${weekStreak()}</b><span>สัปดาห์ที่ทำครบติดกัน</span></div></div>
    ${total ? `<ul class="log-list">${S.workouts.slice(-12).reverse().map(w => `<li><span><b>${esc(w.name)}</b><br><span class="small muted">${thDate(w.date)} · ${w.sets} เซต · ${w.mins} นาที${w.ups && w.ups.length ? ' · เลื่อนขั้น ' + w.ups.length + ' ท่า' : ''}</span></span><span class="mono small">${fmt(w.reps)} ครั้ง</span><span></span></li>`).join('')}</ul>` : '<p class="muted">ยังไม่มีการฝึกที่บันทึก เริ่มครั้งแรกได้ที่หน้า <a href="#train">ฝึก</a></p>'}
  </article>
  <article class="card">
    <h2>สำรองและย้ายข้อมูล</h2>
    <p class="small muted">ข้อมูลทั้งหมดเก็บในเบราว์เซอร์เครื่องนี้เท่านั้น ไม่มีใครเห็น จะย้ายเครื่องให้คัดลอกข้อความสำรองไปวางในเครื่องใหม่</p>
    <textarea id="backup" readonly aria-label="ข้อมูลสำรอง">${esc(JSON.stringify(S))}</textarea>
    <div class="row"><button class="btn sm" data-act="copy-backup">คัดลอกข้อมูลสำรอง</button></div>
    <label class="f">วางข้อมูลสำรองเพื่อกู้คืน<textarea id="restore" placeholder="วางข้อความที่คัดลอกไว้ที่นี่"></textarea></label>
    <div class="row"><button class="btn sm" data-act="restore">กู้คืนข้อมูล</button></div>
  </article>`;
}

function rLearn() {
  const cat = ui.learnCat;
  const tips = cat === 'myth' ? [] : TIPS.filter(t => cat === 'all' || t.c === cat);
  const myths = (cat === 'all' || cat === 'myth') ? MYTHS : [];
  $('#v-learn').innerHTML = `
  <div class="view-head"><span class="eyebrow">ทุกข้อมีงานวิจัยหรือแนวทางทางการแพทย์รองรับ</span><h1>ความรู้</h1>
    <p class="muted">เคล็ดลับที่ใช้ได้จริง พร้อมที่มา อ่านวันละข้อก็พอ</p></div>
  <div class="chips" role="group" aria-label="หมวด">${Object.entries(TIP_CAT).map(([k, l]) => `<button class="chip" data-act="learn-cat" data-c="${k}" aria-pressed="${k === cat}">${l}</button>`).join('')}</div>
  <div class="tips">
    ${tips.map(t => `<div class="tip"><span class="eyebrow">${TIP_CAT[t.c]}</span><h3>${esc(t.t)}</h3><p>${esc(t.b)}</p><p class="src">ที่มา: ${esc(t.s)}</p></div>`).join('')}
    ${myths.map(t => `<div class="tip myth"><span class="eyebrow">ความเชื่อผิดๆ</span><h3>${esc(t.t)}</h3><p><span class="verdict">ความจริง:</span> ${esc(t.b)}</p><p class="src">ที่มา: ${esc(t.s)}</p></div>`).join('')}
  </div>
  <p class="small muted">MewFit ให้ข้อมูลทั่วไป ไม่ใช่คำแนะนำทางการแพทย์ ถ้ามีโรคประจำตัว ตั้งครรภ์ หรือเจ็บระหว่างฝึก ให้ปรึกษาแพทย์หรือนักกายภาพก่อน</p>`;
}



render();
if ('serviceWorker' in navigator && /github\.io$|^localhost$|^127\./.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
