<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MewFit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="MewFit เทรนเนอร์ส่วนตัวที่บ้าน: ตารางฝึกที่ปรับระดับเอง แผนอาหารไทยตามแคลอรี่ ตารางชีวิต และความรู้จากงานวิจัย">
<meta name="theme-color" content="#2443E6">
<link rel="manifest" href="manifest.json" data-pages>
<link rel="icon" href="icon.svg" type="image/svg+xml" data-pages>
<link rel="apple-touch-icon" href="../apple-touch-icon.png" data-pages>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:ital,wght@0,500;0,700;1,800&display=swap">
<style>
/* Layout: one-column app shell (max 980px). Sticky top bar; bottom tab bar on phones, header tabs on desktop.
   Cards only for blocks you act on. Numbers in mono so they line up like a training log. */
:root{
  --bg:#EDEFEA; --surface:#FFFFFF; --sunk:#E2E5DE; --ink:#121815; --muted:#56605A; --line:#D3D7CF;
  --accent:#2443E6; --accent-ink:#FFFFFF; --accent-soft:#DDE3FF; --hot:#D92E64;
  --good:#16804E; --warn:#A86400; --bad:#C2303A; --shadow:0 1px 0 rgba(18,24,21,.04),0 10px 24px -16px rgba(18,24,21,.35);
  --fd:'Kanit','Leelawadee UI','Noto Sans Thai',system-ui,sans-serif;
  --fb:'IBM Plex Sans Thai','Leelawadee UI','Noto Sans Thai',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1113; --surface:#171B1E; --sunk:#101416; --ink:#E8ECE7; --muted:#99A39C; --line:#283036;
  --accent:#7A90FF; --accent-ink:#0A0F2A; --accent-soft:#1D2652; --hot:#FF6894;
  --good:#4CC98C; --warn:#E8A847; --bad:#F2707A; --shadow:0 10px 24px -16px rgba(0,0,0,.8); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1113; --surface:#171B1E; --sunk:#101416; --ink:#E8ECE7; --muted:#99A39C; --line:#283036;
  --accent:#7A90FF; --accent-ink:#0A0F2A; --accent-soft:#1D2652; --hot:#FF6894;
  --good:#4CC98C; --warn:#E8A847; --bad:#F2707A; --shadow:0 10px 24px -16px rgba(0,0,0,.8); color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--fb)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--fd);font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:2px;text-decoration:none;color:var(--ink);font-family:var(--fd)}
.brand .m{font-style:italic;font-weight:800;font-size:1.45rem;color:var(--accent);letter-spacing:-.02em}
.brand .f{font-style:italic;font-weight:800;font-size:1.45rem;letter-spacing:-.02em}
.brand small{margin-left:8px;font-size:.78rem;color:var(--muted);font-family:var(--fb);font-weight:500}
.tabs{display:none;gap:4px;margin-left:auto}
.tabs a,.top-mini a{text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:999px;font-weight:500;font-size:.92rem}
.tabs a[aria-current="page"],.top-mini a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.top-mini{margin-left:auto;display:flex;gap:2px}
@media (min-width:860px){.tabs{display:flex}.top-mini{display:none}}

main{max-width:980px;margin:0 auto;padding-block:20px calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:860px){main{padding-block:28px 64px}}
.view{display:flex;flex-direction:column;gap:16px}
.view-head{display:flex;flex-direction:column;gap:4px;margin-bottom:4px}

/* bottom nav */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:500}
.bottom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bottom a[aria-current="page"]{color:var(--accent)}
@media (min-width:860px){.bottom{display:none}}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none;background:transparent}
.grid{display:grid;gap:16px}
@media (min-width:720px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;line-height:1.2;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:8px}
.btn.big{padding:13px 20px;font-size:1.05rem}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--ink)}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button.chip{border:1px solid transparent;cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.banner{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* hero */
.hero h1{font-size:clamp(1.5rem,4vw,2.1rem)}
.coach{display:flex;gap:12px;align-items:flex-start}
.coach .av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--fd);font-style:italic;font-weight:800}
.coach p{max-width:62ch}

/* metrics */
.metric{display:flex;flex-direction:column;gap:6px}
.metric .top-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.metric .val{font-family:var(--fm);font-weight:600;font-size:1.05rem}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .3s}
.bar.over i{background:var(--warn)}
.bar.ok i{background:var(--good)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--fm);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border-radius:10px;padding:8px 4px;text-align:center;background:var(--sunk);display:flex;flex-direction:column;gap:2px;min-width:0;border:1px solid transparent}
.wd b{font-family:var(--fd);font-size:.95rem}
.wd span{font-size:.68rem;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}
.wd.train{background:var(--accent-soft)}
.wd.today{border-color:var(--accent)}
.wd.done{background:var(--accent);color:var(--accent-ink)}
.wd.done span{color:var(--accent-ink)}
button.wd{cursor:pointer;font:inherit;color:inherit}
button.wd[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}

/* counters */
.counter{display:flex;align-items:center;gap:10px}
.counter .btn{width:38px;height:38px;justify-content:center;padding:0;font-size:1.2rem}
.glasses{display:flex;flex-wrap:wrap;gap:4px}
.glasses i{width:14px;height:20px;border:1.5px solid var(--accent);border-radius:2px 2px 5px 5px;display:block}
.glasses i.on{background:var(--accent)}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:500;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0}
textarea{font-family:var(--fm);font-size:.8rem;min-height:90px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:7px 12px;border-radius:10px;border:1px solid var(--line);font-size:.9rem;font-weight:500}
.seg input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-weight:600;font-size:.9rem;padding:0;margin-bottom:6px}

/* workout */
.ex{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex.complete{border-color:var(--good)}
.ex-h{display:flex;gap:12px;align-items:flex-start}
.ex-i{flex:none;width:30px;height:30px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-family:var(--fm);font-weight:600}
.ex.complete .ex-i{background:var(--good);color:var(--surface)}
.ex-h div{min-width:0}
.ex .en{font-size:.82rem;color:var(--muted)}
.ladder{display:flex;gap:3px;margin-top:4px}
.ladder i{height:5px;flex:1;max-width:22px;border-radius:3px;background:var(--sunk)}
.ladder i.on{background:var(--accent)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.sets label{display:flex;flex-direction:column;gap:3px;font-size:.75rem;color:var(--muted)}
.sets input{text-align:center;font-family:var(--fm);font-size:1.1rem;font-weight:600;padding:8px 4px}
.sets input.hit{border-color:var(--good);color:var(--good)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;font-size:.88rem;color:var(--accent)}
details ul{margin:8px 0 6px;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.warnline{font-size:.85rem;color:var(--warn)}
.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan-list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.plan-list li:last-child{border-bottom:0}
.plan-list li span:first-child{min-width:0}

/* food */
.food-res{display:flex;flex-direction:column;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.food-res button{all:unset;display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.food-res button:hover,.food-res button:focus-visible{background:var(--accent-soft)}
.food-res button span:first-child{min-width:0}
.log-list{list-style:none;margin:0;padding:0}
.log-list li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.log-list li>span:first-child{min-width:0}
.meal{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.meal ul{margin:0;padding-left:18px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;color:var(--muted);font-weight:600}
td.n{font-family:var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:62px 14px 1fr;gap:10px;align-items:start;padding:7px 0}
.tl time{font-family:var(--fm);font-weight:600;font-size:.92rem;padding-top:1px}
.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--line);margin-top:7px}
.tl li.k-train .dot{background:var(--accent)}
.tl li.k-food .dot{background:var(--good)}
.tl li.k-sleep .dot{background:var(--hot)}
.tl b{font-weight:600}
.tl p{color:var(--muted);font-size:.88rem}
.tl li>div{min-width:0}

/* learn */
.tips{display:grid;gap:12px}
@media (min-width:720px){.tips{grid-template-columns:1fr 1fr}}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tip .src{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
.tip.myth h3::before{content:"ความเชื่อ: ";color:var(--bad)}
.verdict{font-weight:600;color:var(--good)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font:500 15px var(--fm)}
.chart .grid-l{stroke:var(--line);stroke-width:1}

/* rest bar + toast + overlay */
.restbar{position:fixed;z-index:25;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  bottom:calc(70px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);
  border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.restbar b{font-family:var(--fm);font-size:1.5rem;font-variant-numeric:tabular-nums}
.restbar .btn{background:transparent;color:var(--bg);border-color:var(--muted)}
.restbar .grow{flex:1;min-width:0;font-size:.85rem}
@media (min-width:860px){.restbar{bottom:20px}}
body.resting main{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;z-index:60;left:50%;transform:translate(-50%,20px);top:calc(70px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;max-width:min(92vw,520px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hiit{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.hiit .phase{font-family:var(--fd);font-size:1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hiit .phase.work{color:var(--accent)}
.hiit .clock{font-family:var(--fm);font-weight:600;font-size:clamp(4.5rem,22vw,9rem);line-height:1;font-variant-numeric:tabular-nums}
.hiit h2{font-size:clamp(1.4rem,5vw,2.2rem)}
.hiit .ring{width:100%;max-width:420px}
.modal-bg{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:var(--r);padding:20px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#today" aria-label="MewFit หน้าแรก"><span class="m">MEW</span><span class="f">FIT</span><small>โค้ชมิว</small></a>
  <nav class="tabs" aria-label="เมนูหลัก">
    <a href="#today">วันนี้</a><a href="#train">ฝึก</a><a href="#eat">กิน</a><a href="#plan">ตารางชีวิต</a><a href="#progress">ความคืบหน้า</a><a href="#learn">ความรู้</a><a href="#profile">โปรไฟล์</a>
  </nav>
  <div class="top-mini"><a href="#learn">ความรู้</a><a href="#profile">โปรไฟล์</a></div>
</div></header>

<main id="app">
  <section id="v-today" class="view" aria-label="วันนี้"></section>
  <section id="v-train" class="view" aria-label="ฝึก" hidden></section>
  <section id="v-eat" class="view" aria-label="กิน" hidden></section>
  <section id="v-plan" class="view" aria-label="ตารางชีวิต" hidden></section>
  <section id="v-progress" class="view" aria-label="ความคืบหน้า" hidden></section>
  <section id="v-learn" class="view" aria-label="ความรู้" hidden></section>
  <section id="v-profile" class="view" aria-label="โปรไฟล์" hidden></section>
</main>

<nav class="bottom" aria-label="เมนูหลัก">
  <a href="#today"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>วันนี้</a>
  <a href="#train"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>ฝึก</a>
  <a href="#eat"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 6V3M9 13h6"/></svg>กิน</a>
  <a href="#plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>ตาราง</a>
  <a href="#progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l5-5 4 3 6-7"/></svg>ผลลัพธ์</a>
</nav>

<div id="restbar" class="restbar" hidden>
  <b id="rest-t">1:15</b><span class="grow" id="rest-l">พักก่อนเซตถัดไป</span>
  <button class="btn sm" data-act="rest-add">+15 วิ</button><button class="btn sm" data-act="rest-skip">ข้าม</button>
</div>

<div id="hiit" class="hiit" hidden role="dialog" aria-modal="true" aria-label="จับเวลาอินเทอร์วัล">
  <div class="phase" id="h-phase">เตรียมตัว</div>
  <div class="clock" id="h-clock">0:10</div>
  <h2 id="h-name">พร้อมไหม</h2>
  <p class="muted" id="h-next"></p>
  <div class="bar ring"><i id="h-bar" style="width:0%"></i></div>
  <div class="row" style="justify-content:center">

  const plan = {}; Object.keys(MEALS).forEach(m => { const opts = MEALS[m]; plan[m] = opts[Math.floor(R() * opts.length)].map(x => x.slice()); });
  const all = () => sumItems([].concat(...Object.values(plan)));
  const add = (m, id, q = 1) => { const it = plan[m].find(x => x[0] === id); if (it) it[1] += q; else plan[m].push([id, q]); };
  const boosters = p.whey ? ['whey', 'chicken_pack', 'egg_boiled'] : ['chicken_pack', 'egg_boiled', 'milk_low', 'egg_white'];
  let g = 0;
  while (all().p < c.protein - 8 && g < 8) { add(g % 2 ? 'snack' : (g % 4 === 0 ? 'dinner' : 'breakfast'), boosters[g % boosters.length]); g++; }
  g = 0;
  while (all().k < c.kcal - 120 && g < 14) { if (g % 3 === 2) add('snack', 'banana'); else add(g % 2 ? 'dinner' : 'lunch', 'rice'); g++; }
  g = 0;
  while (all().k > c.kcal + 120 && g < 20) {
    const rm = ['dinner', 'lunch', 'breakfast'].find(m => plan[m].some(x => (x[0] === 'rice' || x[0] === 'rice_brown') && x[1] > 0));
    if (rm) { const it = plan[rm].find(x => (x[0] === 'rice' || x[0] === 'rice_brown') && x[1] > 0); it[1]--; }
    else { const fr = plan.snack.findIndex(x => FM[x[0]].cat === 'fruit'); if (fr >= 0) plan.snack.splice(fr, 1); else break; }
    g++;
  }
  Object.keys(plan).forEach(m => { plan[m] = plan[m].filter(x => x[1] > 0); });
  return plan;
}

  if (!b || !b.waist || !b.neck) return null;
  const h = p.height;
  if (p.sex === 'm') { if (b.waist - b.neck <= 0) return null; return 495 / (1.0324 - 0.19077 * Math.log10(b.waist - b.neck) + 0.15456 * Math.log10(h)) - 450; }
  if (!b.hip || b.waist + b.hip - b.neck <= 0) return null;
  return 495 / (1.29579 - 0.35004 * Math.log10(b.waist + b.hip - b.neck) + 0.22100 * Math.log10(h)) - 450;
}

/* ---------- daily schedule ---------- */
function timeline(p, tid) {
  const training = !!tid;
  const w = toMin(p.wake), b = toMin(p.bed), ws = toMin(p.workStart), we = toMin(p.workEnd);
  const c = calc(p), it = [];
  const add = (t, title, note, k = '') => it.push({ t: ((t % 1440) + 1440) % 1440, title, note, k });
  const sleepH = ((w - b + 1440) % 1440) / 60;
  add(w, 'ตื่นนอน ดื่มน้ำ 1–2 แก้ว', 'เปิดม่าน รับแสงเช้า 5–10 นาที ช่วยตั้งนาฬิกาชีวิตให้ง่วงตรงเวลาตอนกลางคืน');
  let bf = w + 45;
  if (training && p.trainTime === 'morning') {
    add(w + 20, 'ของว่างก่อนฝึก (ถ้าหิว)', 'กล้วยหนึ่งลูก หรือกาแฟดำหนึ่งแก้ว', 'food');
    add(w + 40, `ฝึก: ${tid ? TPL[tid].n : 'ตามตาราง'} ~${p.minutes} นาที`, 'วอร์มอัพ 5 นาทีก่อนเสมอ', 'train');
    bf = w + 40 + p.minutes + 20;
  }
  add(bf, 'มื้อเช้า เน้นโปรตีน', `ตั้งเป้าโปรตีนราว ${c.perMeal} กรัม เช่น ไข่ต้ม 2 ฟอง + นมหนึ่งกล่อง`, 'food');
  add(ws, 'เริ่มงาน', 'ตั้งเตือนลุกเดิน 2–3 นาทีทุก 50–60 นาที วางขวดน้ำไว้บนโต๊ะ');
  let lunch = clamp(ws + 180, ws + 120, ws + 240);
  if (training && p.trainTime === 'lunch') {
    add(lunch, `ฝึกช่วงพักเที่ยง ~${Math.min(p.minutes, 35)} นาที`, 'วันยุ่งให้เลือกวงจร 7 นาทีแทน', 'train');
    lunch += Math.min(p.minutes, 35) + 10;
  }
  add(lunch, 'มื้อกลางวัน จาน 2:1:1', 'ผักครึ่งจาน ข้าวหนึ่งในสี่ โปรตีนหนึ่งในสี่', 'food');
  add(lunch + 15, 'เดินหลังอาหาร 10 นาที', 'ช่วยคุมน้ำตาลในเลือดหลังมื้ออาหาร');
  add(b - 480, 'กาแฟแก้วสุดท้ายของวัน', 'หลังจากนี้งดคาเฟอีน เพื่อให้หลับลึก');
  const snack = we - 90;
  add(snack, training && p.trainTime === 'evening' ? 'ของว่างก่อนฝึก' : 'ของว่างโปรตีน', 'โยเกิร์ต นมถั่วเหลือง หรืออกไก่ซอง', 'food');
  add(we, 'เลิกงาน', 'ถ้าเดินทางได้ ลงรถก่อนหนึ่งป้ายแล้วเดินต่อ');
  let dinner = we + 75;
  if (training && p.trainTime === 'evening') {
    add(we + 45, `ฝึก: ${tid ? TPL[tid].n : 'ตามตาราง'} ~${p.minutes} นาที`, 'วอร์มอัพ 5 นาที แล้วทำตามหน้าฝึก', 'train');
    dinner = we + 45 + p.minutes + 20;
  }
  add(dinner, 'มื้อเย็น โปรตีน + ผัก', 'อย่างน้อย 2–3 ชั่วโมงก่อนนอน', 'food');
  add(dinner + 30, 'เดินเล่นหรือยืดเหยียด 10–15 นาที', `เป้าก้าวเดินทั้งวัน ${fmt(c.steps)} ก้าว`);
  add(b - 60, 'ปิดจอ หรี่ไฟ เตรียมนอน', 'ห้องมืด เย็น เงียบ เตรียมของสำหรับพรุ่งนี้');
  add(b, `เข้านอน (${r1(sleepH)} ชั่วโมง)`, sleepH < 7 ? 'น้อยกว่า 7 ชั่วโมง ลองเข้านอนเร็วขึ้นหรือตื่นสายขึ้น' : 'การนอนคือช่วงที่กล้ามเนื้อซ่อมแซม', 'sleep');
  return it.sort((x, y) => ((x.t - w + 1440) % 1440) - ((y.t - w + 1440) % 1440));
}

function chartSVG(ws) {
  if (ws.length < 2) return '<p class="muted">บันทึกน้ำหนักอย่างน้อย 2 ครั้งเพื่อดูกราฟ</p>';
  const W = 560, H = 240, L = 52, R = 14, T = 16, B = 34;
  const first = ws[0].d, span = Math.max(1, dayDiff(first, ws[ws.length - 1].d));
  const avg = ws.map(w => { const xs = ws.filter(o => { const t = dayDiff(o.d, w.d); return t >= 0 && t < 7; }).map(o => o.kg); return xs.reduce((a, b) => a + b, 0) / xs.length; });
  let lo = Math.min(...ws.map(w => w.kg)), hi = Math.max(...ws.map(w => w.kg));
  lo = Math.floor(lo * 2) / 2 - 0.5; hi = Math.ceil(hi * 2) / 2 + 0.5;
  const x = d => L + dayDiff(first, d) / span * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const step = (hi - lo) > 6 ? 2 : (hi - lo) > 3 ? 1 : 0.5;
  let grid = ''; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) grid += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v.toFixed(step < 1 ? 1 : 0)}</text>`;
  const line = ws.map((w, i) => `${i ? 'L' : 'M'}${x(w.d).toFixed(1)},${y(avg[i]).toFixed(1)}`).join('');
  const lx = x(ws[ws.length - 1].d), ly = y(avg[avg.length - 1]);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟน้ำหนัก">
    ${grid}
    ${ws.map(w => `<circle cx="${x(w.d).toFixed(1)}" cy="${y(w.kg).toFixed(1)}" r="3" fill="var(--muted)" opacity=".55"/>`).join('')}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx}" cy="${ly}" r="5.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text class="ax" x="${L}" y="${H - 8}">${thDate(first)}</text><text class="ax" x="${W - R}" y="${H - 8}" text-anchor="end">${thDate(ws[ws.length - 1].d)}</text>
  </svg>`;
}

}

/* ---------- workout actions ---------- */
let wakeLock = null;
async function lockScreen() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
function unlockScreen() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

function startSession(tid) {
  if (S.session && S.session.date === iso()) { location.hash = 'train'; return; }
  S.session = buildSession(tid); save(); lockScreen();
  if (location.hash !== '#train') location.hash = 'train'; else render();
}
function shiftLevel(i, dir) {
  const x = S.session.ex[i], L = ladder(x.pt), k = L.findIndex(y => y.id === x.id), n = clamp(k + dir, 0, L.length - 1);
  x.id = L[n].id; S.levels[x.pt] = x.id; x.reps = Array(x.sets).fill(''); save(); render();
  toast(`${dir > 0 ? 'ยากขึ้น' : 'ง่ายลง'}: ${L[n].n}`);
}
function finishSession() {
  const s = S.session; if (!s) return;
  const ups = [], downs = []; let reps = 0, sets = 0;
  s.ex.forEach(x => {
    const e = EXM[x.id], L = ladder(x.pt), k = L.findIndex(y => y.id === x.id);
    const v = x.reps.map(Number).filter(n => n > 0); reps += v.reduce((a, b) => a + b, 0); sets += v.length;
    if (!v.length) return;
    if (v.length === x.sets && Math.min(...v) >= e.r[1]) {
      if (k < L.length - 1) { S.levels[x.pt] = L[k + 1].id; ups.push(`${e.n} → ${L[k + 1].n}`); }
      else { S.levels[x.pt] = x.id; ups.push(`${e.n}: ขั้นสูงสุดแล้ว ครั้งหน้าลงช้า 3 วินาทีหรือเพิ่มอีกหนึ่งเซต`); }
    } else if (Math.max(...v) < e.r[0] && k > 0) { S.levels[x.pt] = L[k - 1].id; downs.push(`${e.n} → ${L[k - 1].n}`); }
    else S.levels[x.pt] = x.id;
  });
  if (!sets) { toast('ยังไม่ได้กรอกเซตไหนเลย กรอกจำนวนครั้งก่อนจบ'); return; }
  const mins = Math.max(1, Math.round((Date.now() - s.start) / 60000));
  S.workouts.push({ date: s.date, tid: s.tid, name: TPL[s.tid].n, mins: Math.min(mins, 180), sets, reps, ups, ex: s.ex.map(x => ({ id: x.id, reps: x.reps })) });
  S.session = null; save(); unlockScreen(); stopRest();
  showModal(`<h2>เสร็จแล้ว เก่งมาก</h2><p>${sets} เซต · ${fmt(reps)} ครั้ง · ${Math.min(mins, 180)} นาที</p>
    ${ups.length ? `<div><b>เลื่อนขั้นครั้งหน้า</b><ul>${ups.map(u => `<li>${esc(u)}</li>`).join('')}</ul></div>` : '<p class="muted">ครั้งหน้าพยายามเพิ่มอีก 1–2 ครั้งในแต่ละเซต ทำได้ถึงเพดานทุกเซตเมื่อไหร่ระบบจะเลื่อนขั้นให้</p>'}
    ${downs.length ? `<div><b>ปรับให้ง่ายลงก่อน</b><ul>${downs.map(u => `<li>${esc(u)}</li>`).join('')}</ul></div>` : ''}
    <p class="small muted">ภายใน 2 ชั่วโมงกินโปรตีนราว ${calc().perMeal} กรัม แล้วดื่มน้ำเพิ่ม 500 ml</p>`);
  location.hash = 'today'; render();
}

/* ---------- rest timer ---------- */
let rest = { end: 0, iv: null };
function startRest(sec, label) {
  rest.end = Date.now() + sec * 1000; $('#rest-l').textContent = label || 'พักก่อนเซตถัดไป'; $('#restbar').hidden = false; document.body.classList.add('resting');
  clearInterval(rest.iv); tickRest(); rest.iv = setInterval(tickRest, 250);
}
function tickRest() {
  const left = (rest.end - Date.now()) / 1000; $('#rest-t').textContent = mmss(left);
  if (left <= 0) { stopRest(); beep(880, 0.25); setTimeout(() => beep(880, 0.25), 300); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} toast('หมดเวลาพัก ไปเซตต่อไป'); }
}
function stopRest() { clearInterval(rest.iv); $('#restbar').hidden = true; document.body.classList.remove('resting'); }

/* ---------- audio ---------- */
let actx = null;
function audio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; } return actx; }
function beep(f = 660, d = 0.15) { const a = audio(); if (!a) return; try { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(0.0001, a.currentTime); g.gain.exponentialRampToValueAtTime(0.3, a.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + d); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + d + 0.02); } catch (e) {} }

/* ---------- interval timer (7-minute circuit, finisher) ---------- */
const H = { prog: [], i: 0, end: 0, left: 0, paused: false, iv: null, total: 0 };
function sevenProgram() { const pr = [{ n: 'เตรียมตัว', s: 10, k: 'prep' }]; SEVEN.forEach((n, i) => { pr.push({ n, s: 30, k: 'work' }); if (i < SEVEN.length - 1) pr.push({ n: 'พัก', s: 10, k: 'rest', next: SEVEN[i + 1] }); }); return pr; }
function finisherProgram() {
  const moves = P().level === 'beginner' ? ['ย่ำเท้ากางแขน', 'แพลงก์ดึงเข่าช้า', 'ยกเข่าสูงเดินอยู่กับที่', 'สควอท'] : ['กระโดดตบ', 'เมาท์เทนไคลม์เบอร์', 'วิ่งยกเข่าสูง', 'สควอทกระโดด'];
  const pr = [{ n: 'เตรียมตัว', s: 10, k: 'prep' }];
  for (let i = 0; i < 8; i++) { pr.push({ n: moves[i % 4], s: 20, k: 'work' }); if (i < 7) pr.push({ n: 'พัก', s: 10, k: 'rest', next: moves[(i + 1) % 4] }); }
  return pr;
}
function hStart(prog) { audio(); H.prog = prog; H.i = 0; H.paused = false; H.total = prog.reduce((a, b) => a + b.s, 0); $('#hiit').hidden = false; $('#h-pause').textContent = 'หยุดชั่วคราว'; hPhase(); lockScreen(); clearInterval(H.iv); H.iv = setInterval(hTick, 200); }
function hPhase() { const ph = H.prog[H.i]; H.end = Date.now() + ph.s * 1000; beep(ph.k === 'work' ? 990 : 520, 0.2); hDraw(); }
function hDraw() {
  const ph = H.prog[H.i], left = H.paused ? H.left : (H.end - Date.now()) / 1000;
  $('#h-phase').textContent = ph.k === 'work' ? 'ลุย' : ph.k === 'rest' ? 'พัก' : 'เตรียมตัว'; $('#h-phase').className = 'phase ' + ph.k;
  $('#h-clock').textContent = mmss(left);
  $('#h-name').textContent = ph.k === 'rest' ? 'ต่อไป: ' + ph.next : ph.k === 'prep' ? 'ท่าแรก: ' + (H.prog[1] ? H.prog[1].n : '') : ph.n;
  const nx = H.prog.slice(H.i + 1).find(x => x.k === 'work'); $('#h-next').textContent = ph.k === 'work' && nx ? 'ถัดไป: ' + nx.n : '';
  const doneS = H.prog.slice(0, H.i).reduce((a, b) => a + b.s, 0) + (ph.s - Math.max(0, left));
  $('#h-bar').style.width = clamp(doneS / H.total * 100, 0, 100) + '%';
}
function hTick() {
  if (H.paused) return;
  const left = (H.end - Date.now()) / 1000;
  if (left <= 3.2 && left > 0 && Math.ceil(left) !== H.lastBeep) { H.lastBeep = Math.ceil(left); beep(440, 0.08); }
  if (left <= 0) { H.i++; if (H.i >= H.prog.length) { hStop(true); return; } hPhase(); return; }
  hDraw();
}
function hStop(done) { clearInterval(H.iv); $('#hiit').hidden = true; unlockScreen(); if (done) { beep(990, .2); setTimeout(() => beep(1320, .3), 250); toast('จบแล้ว เยี่ยมมาก'); } }

/* ---------- modal ---------- */
function showModal(html) { const m = document.createElement('div'); m.className = 'modal-bg'; m.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}<div class="row"><button class="btn pri" data-act="modal-close">ตกลง</button></div></div>`; document.body.appendChild(m); m.querySelector('button').focus(); }

/* ---------- events ---------- */
function copyText(text, fallbackEl) {
  const fb = () => { if (fallbackEl) { fallbackEl.focus(); fallbackEl.select(); } toast('เลือกข้อความแล้ว กดคัดลอกเองได้เลย'); };
  try { navigator.clipboard.writeText(text).then(() => toast('คัดลอกแล้ว'), fb); } catch (e) { fb(); }
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act; if (!a) return;
  const d = iso();
  switch (a) {
    case 'start': ev.preventDefault(); audio(); startSession(el.dataset.tid); break;
    case 'easier': shiftLevel(+el.dataset.i, -1); break;
    case 'harder': shiftLevel(+el.dataset.i, 1); break;
    case 'finish': finishSession(); break;
    case 'cancel': S.session = null; save(); stopRest(); unlockScreen(); render(); toast('ยกเลิกการฝึกแล้ว'); break;
    case 'rest-add': rest.end += 15000; tickRest(); break;
    case 'rest-skip': stopRest(); break;
    case 'seven': hStart(sevenProgram()); break;
    case 'finisher': hStart(finisherProgram()); break;
    case 'h-pause': if (H.paused) { H.paused = false; H.end = Date.now() + H.left * 1000; el.textContent = 'หยุดชั่วคราว'; } else { H.paused = true; H.left = (H.end - Date.now()) / 1000; el.textContent = 'ทำต่อ'; } break;
    case 'h-stop': hStop(false); break;
    case 'water': { const h = habit(d); h.water = clamp(h.water + +el.dataset.n, 0, 20); save(); render(); break; }
    case 'food-add': { const f = FM[el.dataset.id]; (S.food[d] = S.food[d] || []).push({ id: f.id, n: f.n, q: 1, k: f.k, p: f.p, c: f.c, f: f.f }); save(); render(); toast('เพิ่ม ' + f.n); break; }
    case 'food-del': dayFood(d).splice(+el.dataset.i, 1); save(); render(); break;
    case 'food-custom': {
      const n = $('#cf-n').value.trim(), k = +$('#cf-k').value, p = +$('#cf-p').value || 0;
      if (!n || !(k > 0)) { toast('ใส่ชื่ออาหารและแคลอรี่ก่อน'); break; }
      (S.food[d] = S.food[d] || []).push({ id: null, n, q: 1, k, p, c: 0, f: 0 }); save(); render(); toast('เพิ่ม ' + n); break;
    }
    case 'meal-new': S.mealSeed = (S.mealSeed || 1) + 1; save(); render(); break;
    case 'meal-log': { const plan = genMealPlan(); const arr = (S.food[d] = S.food[d] || []); Object.values(plan).forEach(items => items.forEach(([id, q]) => { const f = FM[id]; arr.push({ id, n: f.n, q, k: f.k, p: f.p, c: f.c, f: f.f }); })); save(); render(); toast('บันทึกแผนทั้งวันแล้ว ลบรายการที่ไม่ได้กินออกได้'); break; }
    case 'plan-day': ui.planDay = +el.dataset.d; render(); break;
    case 'copy-plan': { const p = P(), tid = weekMap(p)[ui.planDay]; const txt = `MewFit วัน${DAY_L[ui.planDay]} (${tid ? TPL[tid].n : 'วันพัก'})\n` + timeline(p, tid).map(x => `${toHM(x.t)}  ${x.title}`).join('\n'); copyText(txt); break; }
    case 'w-add': {
      const kg = +$('#w-kg').value, wd = $('#w-d').value || d;
      if (!(kg >= 25 && kg <= 300)) { toast('ใส่น้ำหนักเป็นกิโลกรัม เช่น 72.4'); break; }
      S.weights = S.weights.filter(w => w.d !== wd); S.weights.push({ d: wd, kg: r1(kg) });
      if (S.profile && wd >= S.weights.reduce((m, w) => w.d > m ? w.d : m, '')) S.profile.weight = r1(kg);
      save(); render(); toast('บันทึกน้ำหนักแล้ว'); break;
    }
    case 'w-del': S.weights = S.weights.filter(w => w.d !== el.dataset.d); save(); render(); break;
    case 'b-add': {
      const waist = +$('#b-waist').value, neck = +$('#b-neck').value, hip = $('#b-hip') ? +$('#b-hip').value : 0;
      if (!(waist > 30)) { toast('ใส่รอบเอวเป็นเซนติเมตร'); break; }
      S.body = S.body.filter(b => b.d !== d); S.body.push({ d, waist, neck: neck || null, hip: hip || null }); save(); render(); toast('บันทึกสัดส่วนแล้ว'); break;
    }
    case 'adjust': S.calAdjust = clamp((S.calAdjust || 0) + +el.dataset.n, -500, 500); save(); render(); toast(`เป้าแคลอรี่ใหม่ ${fmt(calc().kcal)} kcal`); break;
    case 'copy-backup': copyText(JSON.stringify(S), $('#backup')); break;
    case 'restore': {
      try { const o = JSON.parse($('#restore').value); if (!o || typeof o !== 'object' || !('workouts' in o)) throw 0; S = Object.assign(fresh(), o); save(); render(); toast('กู้คืนข้อมูลแล้ว'); }
      catch (e) { toast('ข้อความไม่ถูกต้อง ต้องเป็นข้อมูลสำรองจาก MewFit'); }
      break;
    }
    case 'learn-cat': ui.learnCat = el.dataset.c; render(); break;
    case 'reset-ask': ui.resetAsk = true; render(); break;
    case 'reset-no': ui.resetAsk = false; render(); break;
    case 'reset-yes': S = fresh(); save(); ui.resetAsk = false; stopRest(); location.hash = 'today'; render(); toast('ลบข้อมูลทั้งหมดแล้ว'); break;
    case 'modal-close': el.closest('.modal-bg').remove(); break;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'food-q') { ui.foodQ = t.value; const q = t.value.trim().toLowerCase(); $('#food-res').innerHTML = foodRes((q ? FOOD.filter(f => f.n.toLowerCase().includes(q)) : FOOD.filter(f => ['dish', 'protein'].includes(f.cat))).slice(0, 40)); }
  if (t.dataset.habit) { habit(iso())[t.dataset.habit] = t.value; save(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.set && S.session) {
    const [i, s] = t.dataset.set.split('-').map(Number), x = S.session.ex[i], e = EXM[x.id];
    x.reps[s] = t.value === '' ? '' : Math.max(0, Math.round(+t.value)); save();
    t.classList.toggle('hit', +t.value >= e.r[1]);
    const card = $('#ex-' + i), full = x.reps.every(v => v !== '');
    card.classList.toggle('complete', full); card.querySelector('.ex-i').textContent = full ? '✓' : i + 1;
    const last = i === S.session.ex.length - 1 && s === x.sets - 1;
    if (t.value !== '' && !last) startRest(e.t ? 45 : 75, full ? `ต่อไป: ${EXM[S.session.ex[i + 1] ? S.session.ex[i + 1].id : x.id].n}` : `${e.n} เซต ${s + 2}`);
  }
});
document.addEventListener('submit', ev => {
  if (ev.target.id !== 'pf') return;
  ev.preventDefault();
  const f = ev.target, val = n => { const c = f.querySelector(`input[name="${n}"]:checked`); return c ? c.value : null; };
  const days = [...f.querySelectorAll('input[name="days"]:checked')].map(i => +i.value);
  if (!days.length) { toast('เลือกวันฝึกอย่างน้อย 1 วัน'); return; }
  const num = (id, lo, hi) => { const v = +$('#' + id).value; return v >= lo && v <= hi ? v : null; };
  const age = num('pf-age', 14, 90), height = num('pf-height', 120, 230), weight = num('pf-weight', 30, 250);
  if (!age || !height || !weight) { toast('ตรวจอายุ ส่วนสูง และน้ำหนักอีกครั้ง'); return; }
  const eq = { db: false, band: false, bar: false }; f.querySelectorAll('input[name="eq"]:checked').forEach(i => { eq[i.value] = true; });
  const wasDemo = isDemo();
  S.profile = { name: $('#pf-name').value.trim(), sex: val('sex'), age, height, weight: r1(weight), activity: val('activity'), goal: val('goal'), level: val('level'),
    days, minutes: +val('minutes'), eq, wake: $('#pf-wake').value, bed: $('#pf-bed').value, workStart: $('#pf-ws').value, workEnd: $('#pf-we').value,
    trainTime: val('trainTime'), whey: $('#pf-whey').checked, finisher: $('#pf-finisher').checked };
  if (wasDemo && !S.weights.length) S.weights.push({ d: iso(), kg: r1(weight) });
  save(); toast('บันทึกแล้ว โค้ชมิวคำนวณใหม่ให้แล้ว'); location.hash = 'today'; render();
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (S.session || !$('#hiit').hidden)) lockScreen(); });

render();
if ('serviceWorker' in navigator && /github\.io$|^localhost$|^127\./.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
